name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleRelease --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiReloj.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiReloj
          path: MiReloj.apk

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mi Reloj (versión ${{ github.run_number }})
          body: Descarga **MiReloj.apk** desde el celular e instálalo.
          files: MiReloj.apk
          make_latest: true
